[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-lighter-auto-hedge"
version = "0.1.0"
description = "Robinhood Lighter limit fills hedged on Lighter Core"
requires-python = ">=3.11"
dependencies = [
  "lighter-sdk @ git+https://github.com/elliottech/lighter-python.git@38a34672e7cb43c67d807ece25f125fda2dfdecf",
  "aiohttp>=3.9,<4",
  "websockets>=14,<17",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
auto-hedge = "auto_hedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
